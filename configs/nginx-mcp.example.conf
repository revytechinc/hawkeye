# Example nginx location for public, token-authenticated Hawkeye MCP.
# nginx terminates TLS. Hawkeye validates the bearer token.
# Do not put a token or Authorization header in this file.

# Inside the existing hawkeye.revytechinc.com HTTPS server block:
#
#     location /mcp {
#         proxy_pass http://127.0.0.1:8741;
#         proxy_http_version 1.1;
#         proxy_set_header Host $host;
#         proxy_set_header Authorization $http_authorization;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#         proxy_set_header Connection "";
#         proxy_buffering off;
#         proxy_cache off;
#         proxy_read_timeout 86400s;
#     }

location /mcp {
    proxy_pass http://127.0.0.1:8741;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400s;
}

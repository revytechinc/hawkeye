name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Test
        run: go test ./internal/... ./cmd/hawkeye -count=1 -coverprofile=coverage.out
      - name: Coverage summary
        run: go tool cover -func=coverage.out
      - name: Build static binary
        env:
          CGO_ENABLED: "0"
        run: go build -o hawkeye ./cmd/hawkeye
